
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qmc-sampler"
version = "3.0.0"
description = "QMC point sets by spectral optimisation (L2, L1 and WD exclusion regions)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

keywords = [
    "QMC",
    "quasi-Monte Carlo",
    "point sampling",
    "hyperuniformity",
    "wrap-around discrepancy",
    "NUFFT",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pykeops",
]

[project.optional-dependencies]
finufft = ["finufft"]
torch = ["torch"]

[project.urls]
Repository = "https://github.com/For-a-few-DPPs-more/hyperuniform-samplers"

[tool.hatch.build.targets.wheel]
packages = ["src/qmc_sampler"]

[tool.hatch.build]
exclude = [
    "**/*.ipynb",
    "**/*.jpg",
    "**/*.png",
    "**/__pycache__",
]

[tool.ruff]
line-length = 100
