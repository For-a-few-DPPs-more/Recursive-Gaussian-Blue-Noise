[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name        = "blue_sampler"
version     = "5.0.0"
description = "Hyperuniform point sampling (blue noise) on the unit torus"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9"

keywords = [
    "blue noise",
    "hyperuniformity",
    "gaussian blue noise",
    "point process",
    "Monte Carlo",
    "stipling",
    "sampling",
    "structure factor",
    "STIT",
]

dependencies = [
    "numpy",
    "jax",
    "scipy",
    "matplotlib",
    "gridpoints",
    "pillow",
    "structure-factor-v2>=2.0",  # structure factor + plots, re-exported
    "qmc-sampler>=3.1",          # spectral samplers ("nufft", sample_l2...), re-exported
]

[project.optional-dependencies]
gpu12 = [
    "jax[cuda12]",
    "cupy-cuda12x[ctk]",
    "structure-factor-v2[gpu12]",
]
gpu13 = [
    "jax[cuda13]",
    "cupy-cuda13x[ctk]",
    "structure-factor-v2[gpu13]",
]
keops = [
    "pykeops",
]

[project.urls]
Repository = "https://github.com/For-a-few-DPPs-more/Recursive-Gaussian-Blue-Noise"
Documentation = "https://blue-sampler.readthedocs.io"
PyPI = "https://pypi.org/project/blue-sampler/"
"Examples (Colab)" = "https://colab.research.google.com/github/For-a-few-DPPs-more/Recursive-Gaussian-Blue-Noise/blob/main/examples.ipynb"

[tool.hatch.build.targets.wheel]
packages = ["src/blue_sampler"]

[tool.hatch.build]
exclude = [
    "**/*.ipynb",
    "**/*.jpg",
    "**/*.png",
    "**/__pycache__",
]

[tool.ruff]
line-length = 100
