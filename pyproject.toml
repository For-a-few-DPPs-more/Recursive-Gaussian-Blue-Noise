[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name        = "blue_sampler"
version     = "3.1.0"
description = "Hyperuniform point sampling (blue noise) on the unit torus"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9"

keywords = [
    "blue noise",
    "hyperuniformity",
    "gaussian blue noise",
    "point process",
    "Monte Carlo",
    "stipling",
    "sampling",
    "structure factor",
    "STIT",
    "NuFFT",
]

dependencies = [
    "numpy",
    "jax",
    "matplotlib",
    "finufft",
    "squarenet",
    "gridpoints",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]",
    "cupy-cuda12x[ctk]",
    "cufinufft",
]
keops = [
    "pykeops",
]

[project.urls]
Repository = "https://github.com/For-a-few-DPPs-more/Recursive-Gaussian-Blue-Noise"
Documentation = "https://blue-sampler.readthedocs.io"
PyPI = "https://pypi.org/project/blue-sampler/"
"Examples (Colab)" = "https://colab.research.google.com/github/For-a-few-DPPs-more/Recursive-Gaussian-Blue-Noise/blob/main/examples.ipynb"

[tool.hatch.build.targets.wheel]
packages = ["src/blue_sampler"]

[tool.hatch.build]
exclude = [
    "**/*.ipynb",
    "**/*.jpg",
    "**/*.png",
    "**/__pycache__",
]

[tool.ruff]
line-length = 100
